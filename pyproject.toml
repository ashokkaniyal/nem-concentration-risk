[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nem-herding"
version = "0.0.1"
description = "NEM concentration risk and herding-synchronisation framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
analysis = [
    "duckdb>=0.10",
    "scipy>=1.10",
    "tick>=0.7",       # Hawkes processes
    "pointpats>=2.4",  # spatial point pattern statistics (Ripley's K etc.)
    "jupyterlab>=4.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
